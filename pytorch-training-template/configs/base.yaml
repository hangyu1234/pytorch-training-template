seed: 42


experiment:
  name: linear_regression
  runs_dir: runs

data:
  num_samples: 1000
  num_features: 3
  val_ratio: 0.2


model:
  input_dim: 3
  output_dim: 1


training:
  epochs: 16
  batch_size: 32
  lr: 0.01
  device: auto

resume:
  enabled: false
  path: null

task:
  type: regression

selection:
  metric: val_loss
  mode: min